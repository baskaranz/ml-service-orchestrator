openapi: 3.1.0
info:
  title: ML Service Orchestrator API
  version: 1.0.0
  description: |
    API for orchestrating and managing ML model services.
    This API allows tenants to:
    - Submit prediction requests to specific models
    - Get model health status
    - View available models and their capabilities
    - Manage model configurations (admin only)
    - Monitor system and model health

servers:
  - url: http://localhost:8000/api/v1
    description: Local development server
  - url: https://api.example.com/api/v1
    description: Production server

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authentication

  schemas:
    PredictionRequest:
      type: object
      required:
        - input
      properties:
        input:
          type: string
          description: Input data for the model
          example: "Sample input text"
        parameters:
          type: object
          description: Optional parameters for the prediction
          additionalProperties: true
          example:
            temperature: 0.7
            max_tokens: 100

    ModelConfig:
      type: object
      required:
        - id
        - name
        - endpoint_url
      properties:
        id:
          type: string
          description: Unique identifier of the model
        name:
          type: string
          description: Display name of the model
        endpoint_url:
          type: string
          description: URL endpoint for model predictions
        active:
          type: boolean
          description: Whether the model is active
          default: true
        platform:
          type: object
          description: Platform configuration for the model
          properties:
            timeout:
              type: number
              description: Request timeout in seconds
            max_retries:
              type: integer
              description: Maximum number of retry attempts
            health_check:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Whether health checks are enabled
                interval:
                  type: integer
                  description: Time between health checks in seconds
                timeout:
                  type: number
                  description: Health check request timeout in seconds
                failure_threshold:
                  type: integer
                  description: Number of failures before marking unhealthy
                success_threshold:
                  type: integer
                  description: Number of successes to mark as healthy
            circuit_breaker:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Whether circuit breaker is enabled
                failure_threshold:
                  type: integer
                  description: Number of failures before opening the circuit
                reset_timeout:
                  type: number
                  description: Time in seconds before attempting to close the circuit
                half_open_timeout:
                  type: number
                  description: Time in seconds to stay in half-open state
                success_threshold:
                  type: integer
                  description: Number of successful calls to close the circuit
            error_handling:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Whether error handling is enabled
                max_retries:
                  type: integer
                  description: Maximum number of retry attempts
                retry_delay:
                  type: number
                  description: Initial delay between retries in seconds
                max_retry_delay:
                  type: number
                  description: Maximum delay between retries in seconds
                backoff_factor:
                  type: number
                  description: Multiplier for exponential backoff

    PredictionResponse:
      type: object
      required:
        - predictions
        - model_info
      properties:
        predictions:
          type: array
          description: List of predictions
          items:
            type: object
            properties:
              value:
                type: number
                description: Predicted value
              confidence:
                type: number
                description: Confidence score
              label:
                type: string
                description: Predicted label
        model_info:
          type: object
          properties:
            model_id:
              type: string
              description: Unique identifier of the model
            version:
              type: string
              description: Model version
            timestamp:
              type: string
              format: date-time
              description: Time of prediction
        metadata:
          type: object
          description: Additional metadata about the prediction
          additionalProperties: true

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Error code
            message:
              type: string
              description: Error message
            details:
              type: object
              description: Additional error details
              additionalProperties: true

paths:
  /models:
    get:
      summary: List all registered models
      description: Returns a list of all registered models with their basic information
      tags:
        - Models
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelConfig'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
  /models/{model_id}:
    post:
      summary: Submit prediction request to a specific model
      description: |
        Forwards a prediction request to the specified model and returns the results.
        The model must be active and healthy for the request to succeed.
      operationId: predict
      tags:
        - Predictions
      parameters:
        - name: model_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictionRequest'
      responses:
        '200':
          description: Successful prediction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /models/{model_id}/health:
    get:
      summary: Get model health status
      description: Check the health status of a specific model
      operationId: getModelHealth
      tags:
        - Health
      parameters:
        - name: model_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Model health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, unhealthy]
                  model_id:
                    type: string
        '404':
          description: Model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    
  /refresh:
    post:
      summary: Refresh model configurations
      description: Reload model configurations from disk
      tags:
        - Admin
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Successfully refreshed models
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success, error]
                  message:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health:
    get:
      summary: Check orchestrator health
      description: Returns the health status of the orchestrator service
      operationId: healthCheck
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - version
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, unhealthy]
                  version:
                    type: string
                  components:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        status:
                          type: string
                        details:
                          type: object

  /health/details:
    get:
      summary: Get detailed health information
      description: Returns detailed health information for all components
      operationId: detailedHealthCheck
      tags:
        - Health
      responses:
        "200":
          description: Detailed health information
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - version
                  - components
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, unhealthy]
                  version:
                    type: string
                  components:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        status:
                          type: string
                        details:
                          type: object
