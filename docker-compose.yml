version: '3.8'

services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "9090:9090"
    volumes:
      - ./config:/app/config
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Mock services for testing
  model-1-mock:
    image: mockserver/mockserver:latest
    ports:
      - "8001:1080"
    environment:
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/mock-server-config.json
    volumes:
      - ./tests/mocks:/config

  model-2-mock:
    image: mockserver/mockserver:latest
    ports:
      - "8002:1080"
    environment:
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/mock-server-config.json
    volumes:
      - ./tests/mocks:/config

networks:
  default:
    name: ml-orchestrator-network