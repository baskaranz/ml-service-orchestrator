version: "3.8"

# Environment variables are now defined directly in each service

services:
  # Main orchestrator service
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${ORCHESTRATOR_PORT:-8000}:8000"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - PYTHONUNBUFFERED=1
      - APP_ENV=local
      - PORT=8000
      - APP_NAME=orchestrator
      - APP_VERSION=1.0.0
      - DEBUG=true
      - HOST=0.0.0.0
      - WORKERS=1
      - CONFIG_DIR=/app/config/local
      - MODELS_DIR=/app/config/local/models
      - APP_SETTINGS=config.local.DevelopmentConfig
    volumes:
      - ./config/local:/app/config/local
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - ml-network

  # Mock models are now defined in mocks/docker-compose.yml
  # and started separately to avoid port conflicts

networks:
  ml-network:
    driver: bridge
