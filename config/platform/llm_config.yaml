# LLM Provider Configuration
# This file configures the LLM providers used for error classification and other platform features

# Default provider configuration
default_provider:
  type: "huggingface" # or "ollama"
  model_name: "mistralai/Mistral-7B-Instruct-v0.2" # optional
  timeout: 30.0
  max_retries: 3

# Environment-specific overrides
environments:
  development:
    type: "ollama" # Use local Ollama in development
    model_name: "mistral"
    timeout: 30
    max_retries: 3

  production:
    type: "huggingface" # Use Hugging Face in production
    model_name: "mistralai/Mistral-7B-Instruct-v0.2"
    timeout: 45
    max_retries: 5

  test:
    type: "huggingface" # Use smaller model for testing
    model_name: "google/flan-t5-small"
    timeout: 10
    max_retries: 2
