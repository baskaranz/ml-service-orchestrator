repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: debug-statements
    -   id: requirements-txt-fixer

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.6
    hooks:
    -   id: ruff
        args: [--fix, --exit-non-zero-on-fix]

-   repo: https://github.com/psf/black
    rev: 23.11.0
    hooks:
    -   id: black

-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
    -   id: mypy
        additional_dependencies: [pydantic, types-requests, pydantic-settings]
        args: [--ignore-missing-imports, --disallow-untyped-defs, --disallow-incomplete-defs]

-   repo: local
    hooks:
    -   id: pytest-check
        name: pytest-check
        entry: bash -c 'cd $(git rev-parse --show-toplevel) && python -m pytest -xvs'
        language: system
        pass_filenames: false
        always_run: false
        stages: [manual]

    -   id: coverage-check
        name: coverage-check
        entry: bash -c 'cd $(git rev-parse --show-toplevel) && python -m pytest --cov=app'
        language: system
        pass_filenames: false
        always_run: false
        stages: [manual]