id: mock-model-2
name: "Mock Model 2"
description: "Second mock model for testing"
endpoint_url: "http://mock-model-2:8000/predict"
active: true
http2: false  # Disable HTTP/2

timeout: 30.0
max_retries: 3

# Platform configuration
platform:
  timeout: 30.0
  max_retries: 3
  health_check:
    enabled: true
    endpoint: "/health"
    interval: 30
    timeout: 5
    failure_threshold: 3
    success_threshold: 2
  circuit_breaker:
    basic:
      enabled: true
      failure_threshold: 5
      reset_timeout: 60.0
      half_open_timeout: 30.0
      success_threshold: 2
    llm:
      enabled: false
      max_threshold: 10
      min_threshold: 3
      max_timeout: 300.0
      min_timeout: 30.0
      error_types:
        rate_limit:
          threshold_multiplier: 1.5
          timeout_multiplier: 0.5
        transient:
          threshold_multiplier: 1.2
          timeout_multiplier: 0.8
        permanent:
          threshold_multiplier: 0.6
          timeout_multiplier: 2.0

# Metadata
metadata:
  owner: "local-dev"
  version: "1.0.0"
  tags: ["local", "mock"]
  created_at: "2025-05-18T05:47:08Z"
