version: '3.8'

services:
  mock-model-1:
    build: ./mock-model-1
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    networks:
      - ml-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  mock-model-2:
    build: ./mock-model-2
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
    networks:
      - ml-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  orchestrator:
    build: ./orchestrator
    ports:
      - "8000:8000"
    depends_on:
      - mock-model-1
      - mock-model-2
    environment:
      - PORT=8000
    networks:
      - ml-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  ml-network:
    driver: bridge
