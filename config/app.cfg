# Base Configuration for ML Orchestrator
# Environment-specific settings should be overridden in config/{env}/platform/app.cfg

[app]
name = ML Orchestrator
version = 1.0.0
debug = false

[server]
host = 0.0.0.0
port = 8000
workers = 2

[paths]
# These will be overridden by environment-specific configs
config_dir = config
models_dir = config/{env}/models

[service]
timeout = 30.0
max_retries = 3

[circuit_breaker]
failure_threshold = 5
reset_timeout = 30.0
half_open_timeout = 30.0
success_threshold = 2

[error_handling]
backoff_factor = 2.0
max_retry_delay = 30.0
retry_delay = 1.0

[health_check]
enabled = true
interval = 30
timeout = 5
failure_threshold = 3
success_threshold = 2

[logging]
level = INFO
format = json
