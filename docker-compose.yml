version: "3.8"

services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./config/models:/app/config/models
    environment:
      - APP_NAME=Model Orchestrator
      - APP_VERSION=1.0.0
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Mock services for testing
  model-1-mock:
    image: mockserver/mockserver:latest
    ports:
      - "8001:1080"
    environment:
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/mock-server-config.json
    volumes:
      - ./tests/mocks:/config

  model-2-mock:
    image: mockserver/mockserver:latest
    ports:
      - "8002:1080"
    environment:
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/mock-server-config.json
    volumes:
      - ./tests/mocks:/config

networks:
  default:
    name: ml-orchestrator-network
