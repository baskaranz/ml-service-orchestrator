[app]
# Production environment overrides
name = ML Orchestrator (Production)

[server]
workers = 8  # Adjust based on CPU cores

[paths]
log_dir = /var/log/ml-orchestrator/production
models_dir = /etc/ml-orchestrator/models  # External volume for production

[logging]
level = WARNING  # Less verbose in production
max_size = 100  # MB
backup_count = 10

[external_services]
# Production endpoints - should be overridden via environment variables in production
model_service_url = ${MODEL_SERVICE_URL:https://api.example.com/models}
storage_service_url = ${STORAGE_SERVICE_URL:https://storage.example.com}
