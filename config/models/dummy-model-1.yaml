id: "dummy-model-1"
name: "Dummy Model 1"
description: "First dummy model for testing"
version: "1.0.0"
endpoint_url: "http://localhost:8001"
active: true
timeout: 30.0
max_retries: 3
circuit_breaker:
  failure_threshold: 5
  reset_timeout: 30.0
input_schema:
  type: "object"
  properties:
    text:
      type: "string"
      description: "Input text to process"
  required: ["text"]
output_schema:
  type: "object"
  properties:
    result:
      type: "string"
      description: "Processed result"
  required: ["result"]
