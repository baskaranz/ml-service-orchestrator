bug_area: "Circuit Breaker Reset Mechanism"

bug_description: >
  The circuit breaker doesn't properly reset to closed state after the reset timeout period.
  When a circuit breaker opens due to failures, it should automatically attempt to reset
  after the configured reset_timeout period. However, we're seeing that circuits remain
  open indefinitely, requiring manual intervention to reset them.

expected_behavior: >
  After a circuit breaker opens due to reaching the failure threshold, it should:
  1. Remain open for the duration of reset_timeout (typically 30 seconds)
  2. Automatically transition to a half-open state after reset_timeout elapses
  3. Allow a single test request to go through in half-open state
  4. If the test request succeeds, close the circuit and resume normal operation
  5. If the test request fails, reopen the circuit for another reset_timeout period

current_behavior: >
  The circuit breaker opens correctly when the failure threshold is reached, but:
  1. It never transitions from open to half-open state
  2. The reset_timeout period seems to be ignored
  3. Circuits remain open indefinitely until service restart
  4. No logging indicates any attempt to reset the circuit
  5. The issue affects all models using circuit breakers