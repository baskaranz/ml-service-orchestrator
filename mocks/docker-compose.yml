version: "3.8"

x-mock-model: &mock-model-template
  build:
    context: ..
    dockerfile: mocks/Dockerfile
  environment:
    - PORT=8000
    - LOG_LEVEL=DEBUG
  volumes:
    - ../logs:/app/logs
  healthcheck:
    test: ["CMD", "python", "-c", "import requests; exit(0 if requests.get('http://localhost:8000/health', timeout=5).status_code == 200 else 1)"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 40s
  restart: unless-stopped
  networks:
    - ml-network

services:
  mock-model-1:
    <<: *mock-model-template
    ports:
      - "${MOCK_MODEL_1_PORT:-8003}:8000"
    environment:
      - PORT=8000
      - MODEL_NAME=mock-model-1
      - MODEL_VERSION=1.0.0
      - LOG_LEVEL=DEBUG

  mock-model-2:
    <<: *mock-model-template
    ports:
      - "${MOCK_MODEL_2_PORT:-8004}:8000"
    environment:
      - PORT=8000
      - MODEL_NAME=mock-model-2
      - MODEL_VERSION=1.0.0
      - LOG_LEVEL=DEBUG

  mock-model-3:
    <<: *mock-model-template
    ports:
      - "${MOCK_MODEL_3_PORT:-8005}:8000"
    environment:
      - PORT=8000
      - MODEL_NAME=mock-model-3
      - MODEL_VERSION=1.0.0
      - LOG_LEVEL=DEBUG

networks:
  ml-network:
    name: ml-network
    external: true
