test_target: "Core Orchestrator Module"

testing_goals: >
  Create a comprehensive test suite for the Orchestrator module in app/core/orchestrator.py. 
  The tests should verify all functionality, error handling, and edge cases. The goal is 
  to increase test coverage from the current 65% to at least 90% while ensuring the tests
  are meaningful and verify actual behavior, not just achieve line coverage.

coverage_requirements: >
  1. Test all public methods in the Orchestrator class
  2. Test circuit breaker integration and functionality
  3. Verify request routing and transformation
  4. Test error handling for various failure scenarios
  5. Verify timeout and retry mechanism
  6. Test proper handling of different request types
  7. Verify integration with the model registry
  8. Test authentication handling
  9. Verify metrics collection
  10. Test resource cleanup and proper lifecycle management

technical_context: >
  The Orchestrator is responsible for routing requests to appropriate model endpoints,
  handling circuit breakers, retries, timeouts, and error conditions. It interacts with
  the ModelRegistry to get model configurations and maintains circuit breaker state.
  
  The module uses asyncio for non-blocking operations and implements custom error handling
  for various failure modes. The tests should use pytest-asyncio for testing async
  functions and appropriate mocking of external dependencies.
  
  Current test coverage is concentrated on the happy path, with limited testing of error
  handling and edge cases. The circuit breaker functionality in particular has minimal
  test coverage.