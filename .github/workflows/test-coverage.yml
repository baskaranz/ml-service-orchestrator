name: Test Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio
        
    - name: Run tests with coverage
      run: |
        python -m pytest --cov=app --cov-report=xml --cov-report=term-missing
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        
    - name: Check coverage threshold
      run: |
        COVERAGE=$(python -c "import xml.etree.ElementTree as ET; print(ET.parse('./coverage.xml').getroot().attrib['line-rate'])")
        COVERAGE_PCT=$(python -c "print(round(float($COVERAGE) * 100, 2))")
        echo "Current coverage: $COVERAGE_PCT%"
        
        # Check if coverage meets the threshold
        if (( $(echo "$COVERAGE_PCT < 80" | bc -l) )); then
          echo "::warning::Test coverage is below the 80% threshold: $COVERAGE_PCT%"
          # Uncomment the following line to make the workflow fail when coverage is below threshold
          # exit 1
        else
          echo "::notice::Test coverage meets or exceeds the 80% threshold: $COVERAGE_PCT%"
        fi