# Redocly configuration for ML Service Orchestrator API documentation
openapi:
  version: 3.1.0

apis:
  orchestrator:
    root: ./docs/api/orchestrator-api.yaml
    labels:
      - production
      - public

referenceDocs:
  htmlTemplate: ./docs/templates/reference.html
  theme:
    colors:
      primary:
        main: "#3f51b5"  # Primary color for headers and buttons
        light: "#757de8"
        dark: "#002984"
        contrastText: "#ffffff"
      success:
        main: "#4caf50"  # Success color for 200 responses
      error:
        main: "#f44336"  # Error color for 4xx/5xx responses
      http:
        get: "#2196f3"    # GET endpoints
        post: "#4caf50"   # POST endpoints
        put: "#ff9800"    # PUT endpoints
        delete: "#f44336" # DELETE endpoints
    typography:
      fontFamily: "Inter, system-ui, sans-serif"
      fontSize: "16px"
      lineHeight: "1.5"
      headings:
        fontFamily: "Inter, system-ui, sans-serif"
        fontWeight: "600"
    sidebar:
      backgroundColor: "#f8f9fa"
      width: "300px"
      textColor: "#333333"
    codeBlocks:
      backgroundColor: "#f5f5f5"

output:
  html:
    filename: ml-orchestrator-api.html
    includeComponents: true
    sidebarLinks:
      - title: ML Service Orchestrator
        href: "https://github.com/baskaranz/ml-service-orchestrator"
      - title: Documentation
        href: "../docs/"
    generateCodeSamples:
      languages:
        - lang: curl
          label: cURL
        - lang: python
          label: Python
        - lang: javascript
          label: JavaScript
        - lang: go
          label: Go

rules:
  no-unused-components: warning
  operation-description-required: error
  operation-summary-required: warning
  no-unresolved-refs: error
  no-unused-schemas: warning
  operation-2xx-response: error
  operation-4xx-response: warning
  operation-operationId-unique: error
  operation-singular-tag: off
  no-enum-type-mismatch: error
  paths-kebab-case: warning
