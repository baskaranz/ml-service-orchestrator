version: "3.8"

services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/arm64/v8
    ports:
      - "8000:8000"
    volumes:
      - ./config/models:/app/config/models
    environment:
      - APP_NAME=orchestrator
      - APP_VERSION=1.0.0
      - DEBUG=true
      - HOST=0.0.0.0
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - ml-orchestrator-network

networks:
  ml-orchestrator-network:
    driver: bridge
