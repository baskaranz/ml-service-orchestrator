name: Test Coverage Improvement
description: Task for improving test coverage of a specific module
title: "Test Coverage: [Module Name]"
labels: ["test-coverage", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This issue template is for tasks related to improving test coverage for specific modules.
  
  - type: input
    id: module
    attributes:
      label: Module Path
      description: The path to the module that needs test coverage improvement
      placeholder: "app/core/orchestrator.py"
    validations:
      required: true
      
  - type: input
    id: current_coverage
    attributes:
      label: Current Coverage
      description: The current test coverage percentage for this module
      placeholder: "30%"
    validations:
      required: true
      
  - type: input
    id: target_coverage
    attributes:
      label: Target Coverage
      description: The target test coverage percentage for this module
      placeholder: "80%"
    validations:
      required: true
      
  - type: textarea
    id: missing_tests
    attributes:
      label: Missing Test Coverage
      description: Which functions or code paths need test coverage?
      placeholder: "The following functions or code paths need test coverage..."
    validations:
      required: true
      
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: What dependencies or fixtures will be needed for testing?
      placeholder: "The tests will require the following mocked dependencies..."
    validations:
      required: false
      
  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Any additional notes or considerations for testing this module
      placeholder: "Note any special considerations for testing this module..."
    validations:
      required: false
      
  - type: checkboxes
    id: features
    attributes:
      label: Test Features
      description: What test features should be included?
      options:
        - label: Async testing (pytest.mark.asyncio)
        - label: Dependency injection mocking
        - label: Error condition testing
        - label: Edge case testing
        - label: Performance testing
        - label: Integration tests