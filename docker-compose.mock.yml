version: "3.8"

services:
  mock-model-1:
    build:
      context: .
      dockerfile: mocks/Dockerfile.mock
    environment:
      - MODEL_NAME=mock-model-1
      - PORT=9001
      - MODEL_VERSION=1.0.0
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - mock-network
  mock-model-2:
    build:
      context: .
      dockerfile: mocks/Dockerfile.mock
    environment:
      - MODEL_NAME=mock-model-2
      - PORT=9002
      - MODEL_VERSION=1.0.0
    ports:
      - "9002:9002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - mock-network
networks:
  mock-network:
    driver: bridge
