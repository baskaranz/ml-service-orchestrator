feature_name: "Response Caching System"

feature_description: >
  Implement a caching system for model responses that will improve performance
  by storing and reusing results for identical requests. The cache should be
  configurable per model and support various invalidation strategies.

requirements: >
  1. Create a caching service that integrates with the existing proxy service
  2. Support LRU cache implementation with configurable max size
  3. Implement TTL-based cache expiration that can be set per model
  4. Cache keys should be based on model ID and request content hash
  5. Add cache hit/miss metrics for monitoring
  6. Ensure thread safety for concurrent requests
  7. Add a configuration option in model YAML to enable/disable caching
  8. Implement proper cache invalidation when models are updated
  9. Add bypass mechanism for forcing fresh responses

technical_guidelines: >
  - Create a new module in app/services/cache.py for the caching functionality
  - Update the ModelConfig class to include cache configuration
  - Modify the ProxyService to integrate with the caching system
  - Use existing logging patterns for cache events
  - Add comprehensive tests for the caching system
  - Include cache metrics in the health endpoints
  - Ensure the implementation is compatible with async/await patterns
  - Consider using functools.lru_cache or a custom implementation