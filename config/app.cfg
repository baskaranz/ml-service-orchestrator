# Base Configuration for ML Orchestrator
# This file contains default settings that are common across all environments.
# Environment-specific overrides should be placed in config/{env}/app.cfg

[app]
name = ML Orchestrator
version = 1.0.0
debug = false
environment = ${ENV:ENVIRONMENT:development}  # development, staging, production

[server]
host = 0.0.0.0
port = 8000
workers = 2
reload = false

[paths]
config_dir = config
models_dir = ${paths:config_dir}/{app:environment}/models
log_dir = logs/{app:environment}

[logging]
level = INFO
format = json
file = ${paths:log_dir}/app.log
max_size = 10  # MB
backup_count = 5

[security]
# In production, these should come from environment variables or secrets manager
secret_key = ${SECRET_KEY:change-this-in-production}
algorithm = HS256
access_token_expire_minutes = 1440  # 24 hours
