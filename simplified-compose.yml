version: "3.8"

services:
  # Mock Model 1
  mock-model-1:
    build:
      context: .
      dockerfile: mocks/Dockerfile
    ports:
      - "8001:8000"
    environment:
      LOG_LEVEL: "INFO"
      PYTHONUNBUFFERED: "1"
      PORT: "8000"
      MODEL_NAME: "mock-model-1"
      MODEL_VERSION: "1.0.0"
    restart: always
    networks:
      - ml-network

  # Mock Model 2
  mock-model-2:
    build:
      context: .
      dockerfile: mocks/Dockerfile
    ports:
      - "8002:8000"
    environment:
      LOG_LEVEL: "INFO"
      PYTHONUNBUFFERED: "1"
      PORT: "8000"
      MODEL_NAME: "mock-model-2"
      MODEL_VERSION: "1.0.0"
    restart: always
    networks:
      - ml-network

networks:
  ml-network:
    name: ml-network
